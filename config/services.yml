services:
    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ["setFramework", ["@contao.framework"]]

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    pdir_convert_to.listener.ct_source_data_container:
        class: Pdir\ConvertToBundle\EventListener\CtSourceDataContainerListener
        public: true
